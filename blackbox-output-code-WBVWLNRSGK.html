<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Outfits - E-commerce Completo de Camisas de Futebol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-green': '#00ff88',
                        'dark-bg': '#0a0a0a',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .btn-primary {
            @apply bg-gradient-to-r from-green-400 to-emerald-500 hover:from-emerald-500 hover:to-green-400 text-black font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg;
        }
        .product-card {
            @apply bg-gray-900/80 backdrop-blur-sm border border-gray-800 rounded-3xl p-8 hover:border-green-400 transition-all duration-500 hover:scale-105 hover:shadow-2xl hover:shadow-green-500/25;
        }
        .stars { color: #fbbf24; }
        .stadium-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #00ff88 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 text-white font-sans overflow-x-hidden">

<!-- Loading Screen -->
<div id="loading" class="fixed inset-0 bg-black z-50 flex items-center justify-center">
    <div class="text-center">
        <div class="w-20 h-20 border-4 border-green-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-2xl font-bold text-green-400">GB Outfits</h2>
        <p class="text-gray-400 mt-2">Carregando loja...</p>
    </div>
</div>

<div id="root"></div>

<script type="text/babel">
class App extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            products: [],
            cart: [],
            showCart: false,
            showCheckout: false,
            user: null,
            orders: [],
            currentOrder: null,
            loading: true,
            search: '',
            filteredProducts: []
        };
    }

    componentDidMount() {
        this.loadProducts();
        this.loadCart();
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            this.setState({ loading: false });
        }, 2000);
    }

    loadProducts = async () => {
        // Simulando produtos reais
        const products = [
            { id: 1, name: 'Camisa Flamengo 2024 Tailândia', price: 199.90, image: 'https://via.placeholder.com/400x500/FF0000/white?text=FLAMENGO', rating: 4.9, team: 'Flamengo', stock: 50 },
            { id: 2, name: 'Camisa Corinthians 2024 Premium', price: 189.90, image: 'https://via.placeholder.com/400x500/000000/white?text=CORINTHIANS', rating: 4.8, team: 'Corinthians', stock: 35 },
            { id: 3, name: 'Camisa Palmeiras 2024 Tailândia', price: 199.90, image: 'https://via.placeholder.com/400x500/008000/white?text=PALMEIRAS', rating: 4.9, team: 'Palmeiras', stock: 42 },
            { id: 4, name: 'Camisa São Paulo 2024', price: 179.90, image: 'https://via.placeholder.com/400x500/FFFFFF/000?text=SÃO+PAULO', rating: 4.7, team: 'São Paulo', stock: 28 },
            { id: 5, name: 'Camisa Santos 2024 Tailândia', price: 169.90, image: 'https://via.placeholder.com/400x500/0000FF/white?text=SANTOS', rating: 4.6, team: 'Santos', stock: 19 },
            { id: 6, name: 'Camisa Internacional 2024', price: 189.90, image: 'https://via.placeholder.com/400x500/FF1493/white?text=INTER', rating: 4.8, team: 'Internacional', stock: 33 },
        ];
        this.setState({ 
            products, 
            filteredProducts: products 
        });
    }

    loadCart = () => {
        const cart = localStorage.getItem('gb-cart');
        if (cart) {
            this.setState({ cart: JSON.parse(cart) });
        }
    }

    saveCart = (cart) => {
        localStorage.setItem('gb-cart', JSON.stringify(cart));
        this.setState({ cart });
    }

    addToCart = (product) => {
        const existing = this.state.cart.find(item => item.id === product.id);
        let newCart;
        if (existing) {
            newCart = this.state.cart.map(item =>
                item.id === product.id
                    ? { ...item, quantity: item.quantity + 1 }
                    : item
            );
        } else {
            newCart = [...this.state.cart, { ...product, quantity: 1 }];
        }
        this.saveCart(newCart);
        this.showNotification(`${product.name} adicionado ao carrinho!`, 'success');
    }

    removeFromCart = (id) => {
        const newCart = this.state.cart.filter(item => item.id !== id);
        this.saveCart(newCart);
        this.showNotification('Item removido do carrinho!', 'info');
    }

    updateQuantity = (id, quantity) => {
        if (quantity <= 0) return this.removeFromCart(id);
        const newCart = this.state.cart.map(item =>
            item.id === id ? { ...item, quantity } : item
        );
        this.saveCart(newCart);
    }

    getTotal = () => {
        return this.state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
    }

    clearCart = () => {
        this.saveCart([]);
        this.setState({ showCheckout: false });
        this.showNotification('Carrinho limpo!', 'info');
    }

    toggleCart = () => {
        this.setState({ showCart: !this.state.showCart });
    }

    showCheckout = () => {
        if (this.state.cart.length === 0) {
            this.showNotification('Carrinho vazio!', 'error');
            return;
        }
        this.setState({ showCheckout: true, showCart: false });
    }

    processPayment = async (paymentMethod) => {
        this.setState({ loading: true });
        
        // Simulando criação de pedido e pagamento Mercado Pago
        setTimeout(() => {
            const orderId = Date.now();
            const order = {
                id: orderId,
                items: this.state.cart,
                total: parseFloat(this.getTotal()),
                status: 'paid',
                paymentMethod,
                date: new Date().toLocaleString('pt-BR')
            };
            
            this.setState({
                currentOrder: order,
                orders: [order, ...this.state.orders],
                loading: false,
                showCheckout: false
            });
            
            this.clearCart();
            this.showNotification('✅ PAGAMENTO APROVADO! Pedido #' + orderId + ' criado com sucesso!', 'success');
        }, 2000);
    }

    showNotification = (message, type) => {
        // Simples toast notification
        const toast = document.createElement('div');
        toast.className = `fixed top-20 right-4 z-50 p-4 rounded-xl shadow-2xl transform translate-x-full transition-all duration-300 ${
            type === 'success' ? 'bg-green-500 text-white' :
            type === 'error' ? 'bg-red-500 text-white' :
            'bg-blue-500 text-white'
        }`;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.transform = 'translateX(0)';
        }, 100);
        
        setTimeout(() => {
            toast.remove();
        }, 4000);
    }

    handleSearch = (e) => {
        const value = e.target.value.toLowerCase();
        this.setState({ search: value });
        const filtered = this.state.products.filter(product =>
            product.name.toLowerCase().includes(value) ||
            product.team.toLowerCase().includes(value)
        );
        this.setState({ filteredProducts: filtered });
    }

    renderStars = (rating) => {
        return Array(5).fill(0).map((_, i) => (
            <i key={i} className={`fas fa-star ${i < rating ? 'text-yellow-400' : 'text-gray-600'}`}></i>
        ));
    }

    render() {
        const { filteredProducts, search, cart, showCart, showCheckout, currentOrder, orders, loading } = this.state;

        return (
            <div className="min-h-screen">
                {/* Header */}
                <header className="stadium-bg sticky top-0 z-40 backdrop-blur-xl bg-black/80 border-b border-green-500/30">
                    <div className="max-w-7xl mx-auto px-4 py-4">
                        <div className="flex flex-col lg:flex-row items-center justify-between gap-4">
                            <h1 className="text-4xl lg:text-5xl font-black bg-gradient-to-r from-green-400 via-emerald-400 to-green-500 bg-clip-text text-transparent drop-shadow-2xl">
                                GB OUTFITS
                            </h1>
                            <div className="flex items-center gap-4 w-full lg:w-auto">
                                <div className="relative flex-1 lg:w-96 lg:flex-none">
                                    <input
                                        type="text"
                                        placeholder="🔍 Buscar por time ou camisa..."
                                        className="w-full bg-black/50 border-2 border-gray-700 rounded-2xl px-6 py-4 text-white placeholder-gray-400 focus:border-green-400 focus:outline-none transition-all duration-300 backdrop-blur-sm"
                                        value={search}
                                        onChange={this.handleSearch}
                                    />
                                    {search && (
                                        <button
                                            onClick={() => this.setState({ search: '', filteredProducts: this.state.products })}
                                            className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white"
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    )}
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={this.toggleCart}
                                        className="relative p-3 bg-black/50 rounded-2xl hover:bg-green-500/20 transition-all duration-300 border-2 border-gray-700 hover:border-green-400"
                                    >
                                        <i className="fas fa-shopping-cart text-2xl"></i>
                                        {cart.length > 0 && (
                                            <span className="absolute -top-2 -right-2 bg-green-500 text-black text-xs font-bold rounded-full w-7 h-7 flex items-center justify-center">
                                                {cart.reduce((sum, item) => sum + item.quantity, 0)}
                                            </span>
                                        )}
                                    </button>
                                    <button className="hidden md:block btn-primary">
                                        <i className="fas fa-user mr-2"></i> Minha Conta
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                {/* Hero Section */}
                {!showCart && !showCheckout && (
                    <>
                        <section className="relative h-screen flex items-center justify-center overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90"></div>
                            <div className="text-center px-4 max-w-4xl mx-auto z-10 relative">
                                <h2 className="text-6xl md:text-7xl lg:text-8xl font-black bg-gradient-to-r from-green-400 via-emerald-400 to-green-500 bg-clip-text text-transparent mb-8 drop-shadow-2xl animate-pulse">
                                    CAMISAS TAILÂNDIA
                                </h2>
                                <p className="text-xl md:text-2xl lg:text-3xl text-gray-300 mb-12 leading-relaxed max-w-2xl mx-auto">
                                    As <strong>melhores camisas importadas</strong> do mercado brasileiro.<br/>
                                    Qualidade premium • Entrega rápida • Pix e Cartão
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                                    <button className="btn-primary text-xl px-12 py-6 shadow-2xl">
                                        <i className="fas fa-store mr-2"></i> Ver Loja
                                    </button>
                                    <div className="flex items-center gap-8 text-lg">
                                        <div className="flex items-center gap-2">
                                            <i className="fas fa-truck text-green-400 text-2xl"></i>
                                            <span>Entrega Rápida</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <i className="fas fa-shield-alt text-green-400 text-2xl"></i>
                                            <span>Segurança Total</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Featured Products */}
                        <section className="py-24 px-4 max-w-7xl mx-auto">
                            <div className="text-center mb-20">
                                <h3 className="text-5xl font-black bg-gradient-to-r from-green-400 to-emerald-400 bg-clip-text text-transparent mb-6">
                                    🏆 PRODUTOS EM DESTAQUE
                                </h3>
                                <p className="text-xl text-gray-400 max-w-2xl mx-auto">
                                    As camisas mais vendidas da semana - Estoque limitado!
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {filteredProducts.map(product => (
                                    <div key={product.id} className="product-card group">
                                        <div className="relative overflow-hidden rounded-2xl mb-6">
                                            <img 
                                                src={product.image} 
                                                alt={product.name}
                                                className="w-full h-96 object-cover group-hover:scale-110 transition-transform duration-500"
                                            />
                                            <div className="absolute top-4 right-4 bg-green-500 text-black text-xs font-bold px-3 py-1 rounded-full">
                                                {product.stock}+ em estoque
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <h4 className="text-2xl font-bold text-white group-hover:text-green-400 transition-colors">
                                                {product.name}
                                            </h4>
                                            
                                            <div className="flex items-center gap-2">
                                                {this.renderStars(product.rating)}
                                                <span className="text-gray-400 text-sm">({product.rating})</span>
                                            </div>
                                            
                                            <div className="flex items-center justify-between">
                                                <span className="text-3xl font-black text-green-400">
                                                    R$ {product.price.toFixed(2).replace('.', ',')}
                                                </span>
                                                <button
                                                    onClick={() => this.addToCart(product)}
                                                    className="btn-primary px-8 py-3 font-bold shadow-xl hover:shadow-green-500/50"
                                                >
                                                    <i className="fas fa-cart-plus mr-2"></i>
                                                    Adicionar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {search && filteredProducts.length === 0 && (
                                <div className="text-center py-20">
                                    <i className="fas fa-search text-6xl text-gray-600 mb-8"></i>
                                    <h3 className="text-3xl font-bold text-gray-400 mb-4">Nenhum produto encontrado</h3>
                                    <p className="text-gray-500">Tente buscar por outro time ou nome da camisa</p>
                                </div>
                            )}
                        </section>
                    </>
                )}

                {/* Cart Sidebar */}
                {showCart && (
                    <div className="fixed inset-0 z-50 overflow-y-auto" style={{backgroundColor: 'rgba(0,0,0,0.8)'}}>
                        <div className="relative w-full max-w-md h-full bg-gradient-to-b from-gray-900 to-black border-l border-green-500/30">
                            <div className="p-8 sticky top-0 bg-black/50 backdrop-blur-sm border-b border-gray-800">
                                <div className="flex items-center justify-between mb-8">
                                    <h2 className="text-3xl font-black bg-gradient-to-r from-green-400 to-emerald-400 bg-clip-text text-transparent">
                                        🛒 Meu Carrinho
                                    </h2>
                                    <button onClick={this.toggleCart} className="text-2xl hover:text-green-400">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                
                                {cart.length === 0 ? (
                                    <div className="text-center py-20">
                                        <i className="fas fa-shopping-cart text-6
